<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estudiantes - Docente</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#eef4fb;color:#0f172a;min-height:100vh;}
.topbar{
background:#0f2c82;color:#fff;padding:20px;
display:flex;justify-content:space-between;align-items:center;
}
.topbar h1{font-size:24px;}
.topbar p{opacity:.85;font-size:14px;margin-top:4px;}
.container{padding:24px 24px 110px;}
.summary{
background:linear-gradient(135deg,#0f2c82,#2563eb);
color:#fff;border-radius:26px;padding:24px;margin-bottom:22px;
box-shadow:0 12px 28px rgba(15,44,130,.2);
}
.summary h2{font-size:28px;margin-bottom:8px;}
.grid{
display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:18px;
}
.card{
background:#fff;border-radius:22px;padding:22px;
box-shadow:0 5px 18px rgba(0,0,0,.08);
}
.avatar{
width:58px;height:58px;border-radius:18px;background:#dbeafe;color:#1d4ed8;
display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;
margin-bottom:16px;
}
.card h3{margin-bottom:10px;}
.card p{color:#475569;line-height:1.6;margin-bottom:6px;}
.pill{
display:inline-flex;padding:6px 10px;border-radius:999px;
background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:700;margin-top:8px;
}
.empty{
background:#fff;border-radius:22px;padding:28px;text-align:center;
box-shadow:0 5px 18px rgba(0,0,0,.08);color:#64748b;
}
.bottom-nav{
position:fixed;bottom:0;left:0;right:0;height:75px;background:#fff;
display:flex;justify-content:space-around;align-items:center;
box-shadow:0 -2px 10px rgba(0,0,0,.08);z-index:50;
}
.bottom-nav a{
text-decoration:none;color:#6b7280;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;
}
.bottom-nav a i{font-size:22px;}
.bottom-nav a.active{color:#2563eb;}
</style>
</head>
<body>

<div class="topbar">
    <div>
        <h1>Estudiantes</h1>
        <p>Consulta los alumnos distribuidos entre tus clases.</p>
    </div>
    <i class="fa-regular fa-bell"></i>
</div>

<main class="container">
    <section class="summary">
        <h2>Tu comunidad académica</h2>
        <p>Este módulo agrupa a los estudiantes inscritos en al menos una de tus clases.</p>
    </section>

    <section id="lista" class="grid"></section>
</main>

<div class="bottom-nav">
    <a href="dashboard.html">
        <i class="fa-solid fa-house"></i>
        Inicio
    </a>
    <a href="clase.html">
        <i class="fa-solid fa-book"></i>
        Clases
    </a>
    <a href="estudiantes.html" class="active">
        <i class="fa-solid fa-users"></i>
        Estudiantes
    </a>
    <a href="perfil.html">
        <i class="fa-regular fa-user"></i>
        Perfil
    </a>
</div>

<script>
fetch("/api/docente/estudiantes", { credentials: "include" })
    .then((r) => r.json())
    .then((data) => {
        const lista = document.getElementById("lista");

        if (!Array.isArray(data) || data.length === 0) {
            lista.innerHTML = '<div class="empty">Todavía no tienes estudiantes inscritos. Crea una clase o comparte un código para empezar la demo.</div>';
            return;
        }

        lista.innerHTML = data.map((estudiante) => `
            <article class="card">
                <div class="avatar">${estudiante.nombre.charAt(0).toUpperCase()}</div>
                <h3>${estudiante.nombre}</h3>
                <p><strong>Correo:</strong> ${estudiante.correo}</p>
                <p><strong>Materias:</strong> ${estudiante.materias || "No disponible"}</p>
                <span class="pill">${estudiante.clases} clases inscritas</span>
            </article>
        `).join("");
    })
    .catch(() => {
        document.getElementById("lista").innerHTML = '<div class="empty">No fue posible cargar la lista de estudiantes en este momento.</div>';
    });
</script>

</body>
</html>
